services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: credenza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credenza-local-only}
      POSTGRES_DB: credenza
    ports:
      - "5432:5432"
    volumes:
      - credenza-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credenza -d credenza"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  credenza-postgres: